name: faturaguard-automation
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Istanbul
      GENERIC_TIMEZONE: Europe/Istanbul
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "200"
    volumes:
      - mailpit_data:/data
volumes:
  n8n_data:
  mailpit_data:
