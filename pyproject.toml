[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faturaguard-ai"
version = "0.1.0"
description = "Kullanıcı onaylı e-Fatura XML doğrulama ve güvenli düzeltme uygulaması."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.1,<2.0",
    "efatura-kontrol==0.1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "huggingface-hub>=0.34,<3.0",
    "jinja2>=3.1,<4.0",
    "langgraph>=1.0,<2.0",
    "pypdf>=5.0,<7.0",
    "rank-bm25>=0.2,<1.0",
    "sentence-transformers>=5.0,<6.0",
    "python-multipart>=0.0.12,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faturaguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
